services:

  # ============================================================
  # Database: Postgres (default)
  # Per usare MongoDB: commenta questo blocco e decommenta il blocco "mongo" sotto.
  # ============================================================
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       myapp
      POSTGRES_USER:     myapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-myapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # Database alternativo: MongoDB (commentato — decommenta se preferisci documentale)
  # ============================================================
  # db:
  #   image: mongo:7
  #   restart: unless-stopped
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: myapp
  #     MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-myapp}
  #     MONGO_INITDB_DATABASE:      myapp
  #   volumes:
  #     - mongodata:/data/db
  #   ports:
  #     - "127.0.0.1:27017:27017"
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

  app:
    # In prod: immagine pushata da GitHub Actions su GHCR.
    # In dev: `docker compose up --build` ricostruisce da sorgenti.
    image: ghcr.io/zaknafein83/myapp:${TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Postgres
      DB_URL:       jdbc:postgresql://db:5432/myapp
      DB_USER:      myapp
      DB_PASSWORD:  ${DB_PASSWORD:-myapp}
      # MongoDB (se usi mongo, decommenta le righe sotto e commenta quelle Postgres)
      # MONGO_CONNECTION_STRING: mongodb://myapp:${DB_PASSWORD:-myapp}@db:27017/myapp?authSource=admin
      JWT_SECRET:   ${JWT_SECRET:-dev-secret-key-must-be-at-least-32-chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
  # mongodata:
