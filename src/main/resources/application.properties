# ============================================================
# Persistence — Postgres (default)
# ============================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:myapp}
quarkus.datasource.password=${DB_PASSWORD:myapp}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/myapp}

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true

# ============================================================
# Persistence — MongoDB (commentato; decommenta + commenta sopra per switchare)
# ============================================================
# quarkus.mongodb.connection-string=${MONGO_CONNECTION_STRING:mongodb://myapp:myapp@localhost:27017/myapp?authSource=admin}
# quarkus.mongodb.database=myapp

# ============================================================
# Jackson
# ============================================================
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non_null

# ============================================================
# CORS
# ============================================================
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept
quarkus.http.cors.exposed-headers=Content-Type,Authorization
quarkus.http.cors.access-control-max-age=24H

# ============================================================
# Health
# ============================================================
# /q/health, /q/health/ready, /q/health/live esposti automaticamente da smallrye-health

# ============================================================
# Application
# ============================================================
app.jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-32-chars-long}

# ============================================================
# Dev profile overrides
# ============================================================
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/myapp
%dev.quarkus.hibernate-orm.log.sql=true
